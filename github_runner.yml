name: github-actions-runner
services:
  worker:
    image: myoung34/github-runner:latest
    container_name: github-actions-runner
    restart: unless-stopped

    env_file:
      - .github_runner.env

    environment:
      # Organization-level runner configuration
      RUNNER_SCOPE: 'org'
      ORG_NAME: ${ORG_NAME:-stanstrup-metabolomics}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-docker-runner}
      RUNNER_GROUP: ${RUNNER_GROUP:-default}
      LABELS: ${LABELS:-docker,linux}

      # Working directories
      RUNNER_WORKDIR: /tmp/runner/work
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data

      # Do not set EPHEMERAL or DISABLE_AUTO_UPDATE: the image enables them when
      # they have any value, including "false"

      DISABLE_AUTOMATIC_DEREGISTRATION: true

    security_opt:
      - label:disable

    # Host paths are set in a .env file next to this file (see RUNNER_SETUP.md).
    # Use local disks: the model build creates ~150k small files and runs git on
    # them, which is very slow on network shares.
    volumes:
      # Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Runner configuration and state
      - ${RUNNER_DATA_DIR:?Set RUNNER_DATA_DIR in .env}:/runner/data
      # Runner workspace (may be cleaned between jobs)
      - ${RUNNER_WORK_DIR:?Set RUNNER_WORK_DIR in .env}:/tmp/runner/work
      # Persistent rePredRet cache: clone of rePredRet-models used by
      # build-models.yml. Only visible to jobs that run directly in this
      # container, not to jobs that use a container: image.
      - ${REPREDRET_CACHE_DIR:?Set REPREDRET_CACHE_DIR in .env}:/opt/repredret-cache

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

name: Build and Deploy pkgdown Website

on:
  # Manual trigger
  workflow_dispatch:

  # Run on push to main when package or website content changes
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - 'DESCRIPTION'
      - 'NEWS.md'
      - '.github/workflows/build-website.yml'

  # Sent by build-models.yml after the data repository was updated, so the
  # statistics articles (computed from the published model index) refresh
  repository_dispatch:
    types: [models-updated]

  # Run on release
  release:
    types: [published]

# Never cancel a deployment that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pkgdown:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    # Grant GITHUB_TOKEN permission to deploy to GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto, any::devtools, local::.
          needs: website

      - name: Generate documentation
        run: devtools::document()
        shell: Rscript {0}

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE, quiet = FALSE)
        shell: Rscript {0}

      # Pages is set to deploy from GitHub Actions rather than the gh-pages
      # branch, which would run GitHub's built-in pages-build-deployment
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

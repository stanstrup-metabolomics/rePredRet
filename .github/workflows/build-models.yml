name: Build and Update Models

on:
  # Run when RepoRT master has new commits (check daily)
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

  # Manual trigger
  workflow_dispatch:
    inputs:
      max_systems:
        description: 'Max systems to process (0 for all). Test runs (>0) never update the data repository.'
        required: false
        default: '0'

  # Run on push to main for testing
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'inst/scripts/**'
      - '.github/workflows/build-models.yml'

# Prevent concurrent runs from canceling each other (build takes hours)
concurrency:
  group: build-models
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check for RepoRT updates
        id: check
        run: |
          # The pipeline builds from RepoRT master, so track its latest commit
          # (RepoRT releases are rare and not what download_report() fetches)
          LATEST=$(curl -sf https://api.github.com/repos/michaelwitting/RepoRT/commits/master | jq -r .sha)
          echo "Latest RepoRT master commit: $LATEST"

          # Version of the published models (written by run_pipeline.R)
          PROCESSED=$(curl -sfL https://raw.githubusercontent.com/stanstrup-metabolomics/rePredRet-models/main/report_version.txt || echo "none")
          echo "Last processed version: $PROCESSED"

          # Decide if we should run
          if [ "$LATEST" != "$PROCESSED" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_run == 'true'
    runs-on: [self-hosted, docker, linux]
    timeout-minutes: 2880  # 48 hours
    permissions:
      contents: write  # repository_dispatch to rebuild the website
    env:
      # Persistent clone on the runner's local disk. Survives between jobs only
      # because jobs run directly in the runner container (no container: image).
      DATA_REPO: /opt/repredret-cache/rePredRet-models

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git LFS
        run: git lfs install --skip-repo

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # Installs the system libraries the R packages need and fails if any package
      # does not install (install.packages() only warns). The runner image has no
      # binary packages, so the first run compiles from source; the library is cached.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::curl

      - name: Install rePredRet package
        run: R CMD INSTALL .

      - name: Prepare data repository clone
        if: (github.event.inputs.max_systems || '0') == '0'
        run: |
          set -euo pipefail
          # A persistent clone of rePredRet-models on the runner's local disk is
          # both the model cache and the push target. Reset it to the published
          # state first, so a job that died halfway leaves nothing behind.
          # model.rds files are LFS objects; the pipeline only needs them to exist,
          # so they stay pointer files instead of downloading ~50k objects.
          export GIT_LFS_SKIP_SMUDGE=1
          # The cache is a host mount whose files are not owned by the job's
          # user, so git would refuse to use the clone ("dubious ownership")
          git config --global --get-all safe.directory | grep -qxF "$DATA_REPO" ||
            git config --global --add safe.directory "$DATA_REPO"
          if [ -d "$DATA_REPO/.git" ] &&
             git -C "$DATA_REPO" fetch --depth=1 origin main &&
             git -C "$DATA_REPO" reset --hard origin/main &&
             git -C "$DATA_REPO" clean -fdx; then
            echo "Reset existing clone to origin/main"
          else
            echo "Cloning data repository"
            rm -rf /opt/repredret-cache/rePredRet-models
            git clone --depth=1 --branch main \
              https://github.com/stanstrup-metabolomics/rePredRet-models.git "$DATA_REPO"
          fi

          cd "$DATA_REPO"
          git lfs install --local
          git lfs pull --include="build_cache.rds"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Automatic gc/repack after each commit takes minutes on the host mount
          git config gc.auto 0
          git config maintenance.auto false
          echo "Published models: $(find models -mindepth 1 -maxdepth 1 -type d | wc -l)"

          # The pipeline reads and writes its metadata inside models/
          for f in build_cache.rds model_index.csv; do
            if [ -f "$f" ]; then cp "$f" models/; fi
          done

      - name: Run pipeline with build cache
        env:
          MAX_SYSTEMS: ${{ github.event.inputs.max_systems || '0' }}
          MODELS_DIR: ${{ env.DATA_REPO }}/models
          REPORT_VERSION: ${{ needs.check-release.outputs.version }}
        run: Rscript inst/scripts/run_pipeline.R

      - name: Update data repository
        if: env.models_changed == 'true' && (github.event.inputs.max_systems || '0') == '0'
        env:
          MODELS_REPO_PAT: ${{ secrets.MODELS_REPO_PAT }}
        run: |
          set -euo pipefail
          cd "$DATA_REPO"

          # Move metadata from models/ back to the repo root
          for f in build_cache.rds model_index.csv report_version.txt; do
            if [ -f "models/$f" ]; then mv "models/$f" .; fi
          done

          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 600
          # Authenticate with a header passed through the environment, which
          # (unlike a token in the URL or a -c option) does not show up in the
          # process list. git-lfs reads the same configuration.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$MODELS_REPO_PAT" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          push() {
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then return 0; fi
              echo "Push attempt $attempt failed, retrying in 30 seconds..."
              sleep 30
            done
            return 1
          }

          # Commit and push changed model directories (built, rebuilt or removed)
          # in chunks, so a full rebuild does not become one huge push
          mapfile -t DIRS < <(git ls-files --modified --others --deleted --exclude-standard -- models |
                              cut -d/ -f2 | sort -u)
          echo "Changed model directories: ${#DIRS[@]}"
          CHUNK=5000
          for ((i = 0; i < ${#DIRS[@]}; i += CHUNK)); do
            printf 'models/%s\n' "${DIRS[@]:i:CHUNK}" | git add -A --pathspec-from-file=-
            git commit -q -m "Update models (part $((i / CHUNK + 1)))"
            push
          done

          # Index, cache and version last: the published version only changes
          # once all models are pushed
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Update model index and build cache" \
              -m "RepoRT version: ${{ needs.check-release.outputs.version }}" \
              -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            push
          fi
          echo "Data repository updated"

      - name: Rebuild website statistics
        if: env.models_changed == 'true' && (github.event.inputs.max_systems || '0') == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type": "models-updated"}'

      - name: Report status
        if: always()
        run: |
          if [ "${{ env.models_changed }}" == "true" ]; then
            echo "Models updated and pushed to rePredRet-models repository"
          else
            echo "No model updates needed"
          fi

  notify:
    needs: [check-release, build]
    if: always() && needs.check-release.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "Model build completed successfully for RepoRT ${{ needs.check-release.outputs.version }}"
          else
            echo "Model build failed for RepoRT ${{ needs.check-release.outputs.version }}"
            exit 1
          fi

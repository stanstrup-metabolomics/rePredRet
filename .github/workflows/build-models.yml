name: Build and Update Models

on:
  # Run on RepoRT releases (check daily)
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC

  # Manual trigger
  workflow_dispatch:
    inputs:
      max_systems:
        description: 'Max systems to process (0 for all)'
        required: false
        default: '0'
      n_boot:
        description: 'Bootstrap iterations'
        required: false
        default: '1000'

  # Run on push to main for testing
  push:
    branches: [main, master]
    paths:
      - 'R/**'
      - 'inst/scripts/**'
      - '.github/workflows/build-models.yml'

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Checkout data repository (sparse)
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone --filter=blob:none --no-checkout \
            https://github.com/stanstrup-metabolomics/rePredRet-models.git data_repo
          cd data_repo
          git sparse-checkout set build_cache.rds model_index.csv
          git checkout
          # Cleanup to prevent pack corruption on next repo operation
          git gc --aggressive --prune=now || true

      - name: Check for new RepoRT release
        id: check
        run: |
          # Get latest RepoRT release
          LATEST=$(curl -s https://api.github.com/repos/michaelwitting/RepoRT/releases/latest | jq -r .tag_name)
          echo "Latest RepoRT release: $LATEST"

          # Check if we've processed this version (from build cache)
          PROCESSED=$(Rscript -e "cache <- readRDS('data_repo/build_cache.rds'); cat(cache\$report_version %||% 'none')" 2>/dev/null || echo "none")
          echo "Last processed version: $PROCESSED"

          # Decide if we should run
          if [ "$LATEST" != "$PROCESSED" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_run == 'true'
    runs-on: [self-hosted, docker, linux]
    timeout-minutes: 2880  # 48 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cleanup and Setup Git LFS
        run: |
          # Disable fsync - Docker/overlayfs doesn't support it and causes
          # "fsync error: Permission denied" on pack files
          git config --global core.fsync none
          # Clean up git pack files to prevent corruption
          git gc --aggressive --prune=now || true
          git lfs install --skip-repo

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        run: |
          install.packages(c(
            "remotes", "boot", "cli", "data.table", "digest", "dplyr", "future", "furrr",
            "ggplot2", "htmlwidgets", "jsonlite", "MASS", "Matrix", "mgcv", "plotly",
            "pracma", "rappdirs", "readr", "tibble", "curl"
          ))
        shell: Rscript {0}

      - name: Install rePredRet package
        run: |
          remotes::install_local(".", dependencies = FALSE)
        shell: Rscript {0}

      - name: Checkout data repository (for build cache)
        run: |
          # Clone with retry logic to handle transient network/corruption issues
          MAX_RETRIES=3
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Clone attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."

            # Clean up any partial clone from previous attempt
            rm -rf data_repo

            # Use sparse checkout: only check out build_cache.rds initially
            # (full checkout of ~50k model files fails on some runners)
            if GIT_LFS_SKIP_SMUDGE=1 git clone --no-checkout \
              https://${{ secrets.MODELS_REPO_PAT }}@github.com/stanstrup-metabolomics/rePredRet-models.git data_repo; then
              echo "Clone successful"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Clone failed, retrying in 10 seconds..."
                sleep 10
              else
                echo "Clone failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

          cd data_repo
          # Sparse checkout: only need build_cache.rds and model_index.csv for now
          git sparse-checkout set build_cache.rds model_index.csv
          git checkout
          # Pull build cache from LFS
          git lfs pull --include="build_cache.rds"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Restore build cache and models
        run: |
          mkdir -p website/data/models
          RUNNER_CACHE="/opt/repredret-cache/models"

          # Restore models from runner-local cache (survives across CI runs)
          # This enables resume after a failed push without rebuilding
          if [ -d "$RUNNER_CACHE" ] && [ "$(ls -A "$RUNNER_CACHE" 2>/dev/null)" ]; then
            echo "Restoring models from runner cache..."
            cp -a "$RUNNER_CACHE"/. website/data/models/
            echo "Restored $(find website/data/models -name 'model.rds' | wc -l) models from runner cache"
          fi

          # Overlay build_cache.rds from git repo (authoritative source)
          if [ -f data_repo/build_cache.rds ]; then
            cp data_repo/build_cache.rds website/data/models/
            echo "Copied build cache from data repo"
          fi

      - name: Run pipeline with build cache
        env:
          MAX_SYSTEMS: ${{ github.event.inputs.max_systems || '0' }}
          N_BOOT: ${{ github.event.inputs.n_boot || '1000' }}
        run: |
          max_sys <- as.integer(Sys.getenv("MAX_SYSTEMS", "0"))
          n_boot <- as.integer(Sys.getenv("N_BOOT", "1000"))

          # Convert 0 to Inf for "all systems"
          if (max_sys == 0) max_sys <- Inf

          source("inst/scripts/run_pipeline.R")
        shell: Rscript {0}

      - name: Save models to runner cache
        if: always()
        run: |
          # Persist built models on the self-hosted runner so they survive
          # across CI runs. This avoids rebuilding after a failed push.
          RUNNER_CACHE="/opt/repredret-cache/models"
          if [ -d website/data/models ]; then
            mkdir -p "$RUNNER_CACHE"
            rsync -a --delete website/data/models/ "$RUNNER_CACHE"/
            echo "Saved $(find "$RUNNER_CACHE" -name 'model.rds' | wc -l) models to runner cache"
          fi

      - name: Update data repository
        run: |
          cd data_repo

          # Disable sparse checkout so git can track all model files
          git sparse-checkout disable

          # Copy new/updated models
          echo "Copying updated models..."
          rsync -av --delete ../website/data/models/ models/

          # Copy metadata files
          cp ../website/data/models/build_cache.rds .
          if [ -f ../website/data/models/model_index.csv ]; then
            cp ../website/data/models/model_index.csv .
          fi

          # Check for changes (include untracked files)
          if [ -z "$(git status --porcelain)" ]; then
            echo "No model changes to commit"
            echo "has_changes=false" >> $GITHUB_ENV
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_ENV

          # Configure git for large pushes
          git config http.postBuffer 524288000  # 500MB
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 600  # 10 min timeout for slow transfers
          git config pack.windowMemory 256m
          git config pack.packSizeLimit 200m

          # Refresh remote URL with current token before push
          # (token embedded at clone time may be stale after hours-long build)
          git remote set-url origin "https://${{ secrets.MODELS_REPO_PAT }}@github.com/stanstrup-metabolomics/rePredRet-models.git"

          # --- Batched commit + push ---
          # Push metadata files first (small, always needed)
          git add build_cache.rds model_index.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update metadata (automated build)" \
              -m "RepoRT version: ${{ needs.check-release.outputs.version }}" \
              -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            if ! git push 2>&1; then
              echo "Failed to push metadata"
              exit 1
            fi
            echo "Metadata pushed successfully"
          fi

          # Batch model directories to avoid HTTP 500 on large pushes
          BATCH_SIZE=2000
          if [ -d models/ ]; then
            cd models/
            MODEL_DIRS=($(ls -d */ 2>/dev/null))
            cd ..
          else
            MODEL_DIRS=()
          fi

          TOTAL=${#MODEL_DIRS[@]}
          echo "Total model directories: $TOTAL"

          if [ $TOTAL -eq 0 ]; then
            # No model dirs but maybe other changes (deletions etc)
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "Update models (automated build)"
              git push 2>&1 || exit 1
            fi
            exit 0
          fi

          BATCH_NUM=0
          for ((i=0; i<TOTAL; i+=BATCH_SIZE)); do
            BATCH_NUM=$((BATCH_NUM + 1))
            END=$((i + BATCH_SIZE))
            if [ $END -gt $TOTAL ]; then END=$TOTAL; fi

            echo "=== Batch $BATCH_NUM: directories $((i+1))-$END of $TOTAL ==="

            # Stage this batch of model directories
            for ((j=i; j<END; j++)); do
              git add "models/${MODEL_DIRS[$j]}"
            done

            # Skip if nothing staged in this batch
            if git diff --cached --quiet; then
              echo "No changes in this batch, skipping"
              continue
            fi

            git commit -m "Update models batch $BATCH_NUM (automated build)"

            # Push with retry
            MAX_RETRIES=3
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Push attempt $((RETRY_COUNT + 1))/$MAX_RETRIES for batch $BATCH_NUM..."
              if git push 2>&1; then
                echo "Batch $BATCH_NUM pushed successfully"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "Push failed, refreshing token and retrying in 30 seconds..."
                  git remote set-url origin "https://${{ secrets.MODELS_REPO_PAT }}@github.com/stanstrup-metabolomics/rePredRet-models.git"
                  sleep 30
                else
                  echo "Push failed after $MAX_RETRIES attempts for batch $BATCH_NUM"
                  exit 1
                fi
              fi
            done
          done

          # Handle any remaining changes (deletions of removed models, etc.)
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Cleanup removed models (automated build)"
            git push 2>&1 || exit 1
          fi

          echo "All batches pushed successfully"

      - name: Report status
        if: always()
        run: |
          if [ "${{ env.has_changes }}" == "true" ]; then
            echo "Models updated and pushed to rePredRet-models repository"
          else
            echo "No model updates needed"
          fi

  notify:
    needs: [check-release, build]
    if: always() && needs.check-release.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "Model build completed successfully for RepoRT ${{ needs.check-release.outputs.version }}"
          else
            echo "Model build failed for RepoRT ${{ needs.check-release.outputs.version }}"
            exit 1
          fi
